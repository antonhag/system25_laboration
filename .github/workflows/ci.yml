name: CI

on: 
  workflow_dispatch:
  push:
    branches: main
  pull_request: 
    branches: main

jobs:
  build:
    name: Bygg och Testa
    runs-on: ubuntu-latest
    steps:
      - name: build-and-test
        run: echo "Bygg och testa"
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: restore
        run: dotnet restore
      - name: build 
        run: dotnet build --no-restore --configuration Release
      - name: test
        run: dotnet test --no-build --configuration Release

       
     
    
        
          
